<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1e1b4b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>Cash Ledger · Litpax</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Login -->
  <div id="loginView" class="login-wrap">
    <div class="login-card fade-in">
      <div class="logo">₹</div>
      <h1 class="brand">Cash Ledger</h1>
      <p class="muted">Litpax Technology · Enter your PIN</p>
      <input id="pin" class="input pin-input" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••" />
      <button id="loginBtn" class="btn btn-primary">Login</button>
      <div id="loginErr" class="err"></div>
    </div>
  </div>

  <!-- App -->
  <div id="appView" class="app hidden">
    <aside class="sidebar">
      <div class="brand-side"><span class="logo sm">₹</span> Cash Ledger</div>
      <nav id="nav" class="nav"></nav>
      <div class="side-foot">
        <div id="who" class="who"></div>
        <button id="logoutBtn" class="btn btn-side">Logout</button>
      </div>
    </aside>
    <main class="content">
      <header class="topbar">
        <h2 id="pageTitle" class="page-title"></h2>
        <button id="refreshBtn" class="btn btn-ghost btn-sm" title="Refresh">Refresh</button>
      </header>
      <section id="page" class="page"></section>
    </main>
  </div>

  <!-- Modal (forms, details) -->
  <div id="modal" class="overlay hidden"><div id="modalBox" class="modal-box"></div></div>
  <!-- Dialog (confirm / reason) — sits above modal -->
  <div id="dialog" class="overlay top hidden"><div id="dialogBox" class="modal-box modal sm"></div></div>

  <div id="toast" class="toast"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
